<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="strap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#262626"/><stop offset=".5" stop-color="#383838"/><stop offset="1" stop-color="#262626"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4c4c4c"/><stop offset="1" stop-color="#2a2a2a"/>
    </linearGradient>
    <clipPath id="tile"><rect width="128" height="128" rx="28"/></clipPath>
  </defs>
  <rect width="128" height="128" rx="28" fill="#1c1c1c"/>
  <!-- the band, as in Openband's icon -->
  <g clip-path="url(#tile)">
    <path d="M19 0 H43 L42 40 H20 Z" fill="url(#strap)"/>
    <path d="M20 88 H42 L43 128 H19 Z" fill="url(#strap)"/>
  </g>
  <rect x="13" y="36" width="36" height="56" rx="13" fill="url(#body)"/>
  <rect x="16" y="39" width="30" height="50" rx="10" fill="#0b0b0b"/>
  <path d="M26 71 A9 9 0 1 1 36 71" fill="none" stroke="#ff7a1a" stroke-width="4" stroke-linecap="round"/>
  <!-- a tap going out -->
  <path d="M56 57 a10 10 0 0 1 0 14" fill="none" stroke="#ededed" stroke-width="4" stroke-linecap="round"/>
  <!-- the arm: base, upper arm, forearm, gripper -->
  <rect x="68" y="94" width="40" height="10" rx="3" fill="#ededed"/>
  <path d="M88 94 L80 62 L106 44" fill="none" stroke="#ff7a1a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M106 44 L110 32 M106 44 L117 48" fill="none" stroke="#ff7a1a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="80" cy="62" r="5" fill="#1c1c1c" stroke="#ededed" stroke-width="3"/>
  <circle cx="88" cy="92" r="5" fill="#1c1c1c" stroke="#ededed" stroke-width="3"/>
</svg>
